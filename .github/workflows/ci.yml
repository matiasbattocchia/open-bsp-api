name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Manual run from the Actions tab (useful if a PR event was missed).
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: cd supabase/functions && deno lint && deno check .
      - run: cd supabase/functions && deno test --allow-env _shared/luna-whatsapp-batch_test.ts _shared/whatsapp-interactive-buttons_test.ts
      - run: cd plugin && deno lint && deno check .
